main:
  push:
    - services:
        - docker
      docker:
        # Persistent node-local caches. They survive across pipeline runs on the
        # same build node, so the Go build/module cache is not rebuilt from
        # scratch every time. The declared paths must not overlap.
        volumes:
          - /root/.cache/go-build
          - /go/pkg/mod
      stages:
        # - name: commitlint
        #   image: cnbcool/commitlint
        - name: auto-tag
          image: cnbcool/git-auto-tag:latest
          settings:
            tagFormat: v\${version}
            toFile: tag_info.json
            dryRun: false
            blockWhenFail: false
            # releaseRules: ./release-rules.json
            branch: $CNB_BRANCH
            repoUrlHttps: $CNB_REPO_URL_HTTPS
          exports:
            tag: NEW_TAG
        - name: show tag
          script: echo $NEW_TAG
        - name: show tag res
          script: |
            if [ -f tag_info.json ]; then cat tag_info.json; else echo "tag_info.json not found, skipping"; fi
        - name: generate changelog and create release
          script: |
            # New tag from auto-tag stage; fall back to latest tag if empty
            CURRENT_TAG="${NEW_TAG:-$(git describe --tags --abbrev=0 2>/dev/null || echo "")}"
            # Previous tag (excluding CURRENT_TAG)
            PREV_TAG=$(git tag --merged HEAD --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n 1 || echo "")

            echo "=== Release Info ==="
            echo "CURRENT_TAG: ${CURRENT_TAG}"
            echo "PREV_TAG:    ${PREV_TAG}"

            # Generate changelog from commit history
            REPO_URL="https://cnb.cool/liyao52033/CLIProxyAPIPlus"
            if [ -n "${PREV_TAG}" ]; then
              RANGE="${PREV_TAG}..${CURRENT_TAG}"
            else
              RANGE="-50"
            fi

            echo "=== Changelog (max 200 commits) ==="
            # Limit changelog to 200 commits to avoid exceeding API payload size limits
            git log ${RANGE} --pretty=format:"- [%h](${REPO_URL}/-/commit/%H) %s" --no-merges -200 > /tmp/changelog.txt
            cat /tmp/changelog.txt

            # Ensure body does not exceed 80KB to stay within API limits
            BODY_SIZE=$(wc -c < /tmp/changelog.txt)
            echo "Changelog body size: ${BODY_SIZE} bytes"
            if [ "${BODY_SIZE}" -gt 80000 ]; then
              echo "WARNING: Changelog exceeds 80KB, truncating..."
              head -c 80000 /tmp/changelog.txt > /tmp/changelog_trimmed.txt
              echo "" >> /tmp/changelog_trimmed.txt
              echo "... (truncated, full history available in git log)" >> /tmp/changelog_trimmed.txt
              mv /tmp/changelog_trimmed.txt /tmp/changelog.txt
            fi

            # Check if release already exists
            EXIST_RELEASE=$(curl --silent --fail --request GET \
              --url "${CNB_API_ENDPOINT}/liyao52033/CLIProxyAPIPlus/-/releases/tags/${CURRENT_TAG}" \
              --header "Accept: application/vnd.cnb.api+json" \
              --header "Authorization: Bearer ${CNB_TOKEN}" || echo "")

            if [ -n "${EXIST_RELEASE}" ]; then
              echo "Release ${CURRENT_TAG} already exists, skip creation"
            else
              # Build JSON payload to a file to avoid ARG_MAX when passing via curl --data
              jq -Rs \
                --arg tag_name "${CURRENT_TAG}" \
                '{tag_name: $tag_name, name: $tag_name, body: ., draft: false, prerelease: false, make_latest: "true"}' \
                /tmp/changelog.txt > /tmp/release_payload.json

              # Use --data @file to avoid shell argument length limits
              # Do NOT use set -e so that a release creation failure doesn't block downstream stages
              HTTP_CODE=$(curl --write-out "%{http_code}" --silent --output /tmp/release_response.txt \
                --request POST \
                --url "${CNB_API_ENDPOINT}/liyao52033/CLIProxyAPIPlus/-/releases" \
                --header "Accept: application/vnd.cnb.api+json" \
                --header "Authorization: Bearer ${CNB_TOKEN}" \
                --header "Content-Type: application/json" \
                --data @/tmp/release_payload.json)

              if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
                echo "✅ Release ${CURRENT_TAG} created successfully"
              else
                echo "⚠️ Failed to create release ${CURRENT_TAG} (HTTP ${HTTP_CODE})"
                cat /tmp/release_response.txt
                echo "Release creation skipped — continuing pipeline"
              fi
            fi
        - name: build dependency cache image
          type: docker:cache
          options:
            dockerfile: Dockerfile.cache
            # Only these files are in the cache build context.
            by:
              - go.mod
              - go.sum
            # Rebuild the cache image only when its own Dockerfile or the
            # module graph changes; not on every source change.
            #
            # Dockerfile.cache MUST be listed here. The CNB cache version is
            # sha1(Dockerfile + versionBy + buildArgs + target + arch) where
            # `Dockerfile` means the file named by `dockerfile:`; `by` only
            # controls the build context. Without this entry, a commit that
            # only edits Dockerfile.cache would keep the same cache key and
            # silently reuse the stale toolchain image.
            versionBy:
              - Dockerfile.cache
              - go.mod
              - go.sum
            # MUST stay true. `sync` defaults to false, which only means the
            # cache image was built and pushed - the push itself keeps running
            # in the background while the next stage starts. `prepare build
            # args` then pulls the tag before it is readable and fails with:
            #
            #   failed to resolve reference "...dockerfile-caches:<sha>": not found
            #
            # The second-order damage is worse than the error: the tag does not
            # exist yet, so docker:cache always treats the next run as a local
            # and remote cache miss and rebuilds the whole toolchain image
            # (~110s) instead of skipping the stage.
            sync: true
          exports:
            name: BUILD_CACHE_IMAGE

        - name: prepare build args
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/envs.yml
          timeout: 30m
          script: |
              VERSION="${NEW_TAG:-$(git describe --tags --abbrev=0 2>/dev/null || echo "")}"
              COMMIT="${CNB_COMMIT:-$(git rev-parse --short HEAD 2>/dev/null || echo none)}"
              BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

              echo "=== Build Args ==="
              echo "VERSION:   ${VERSION}"
              echo "COMMIT:    ${COMMIT}"
              echo "BUILD_DATE: ${BUILD_DATE}"
              if [ -n "${CPA_TOKEN}" ]; then echo "CPA_TOKEN: get"; else echo "CPA_TOKEN: not found"; fi
              echo "BUILD_CACHE_IMAGE: ${BUILD_CACHE_IMAGE:-none}"

              # Seed the builder image from the prebuilt dependency cache so the
              # gcc/musl-dev toolchain and the Go module graph are never
              # downloaded again. An empty or unreadable value must degrade to
              # the plain builder image, not abort the release: `sync: true` on
              # the cache stage is what guarantees the tag is readable here, and
              # this is only the second line of defence.
              CACHE_IMAGE="${BUILD_CACHE_IMAGE:-golang:1.26-alpine3.23}"
              if [ -n "${BUILD_CACHE_IMAGE}" ]; then
                if docker pull "${BUILD_CACHE_IMAGE}"; then
                  echo "Using cached builder image: ${BUILD_CACHE_IMAGE}"
                else
                  echo "WARNING: cache image ${BUILD_CACHE_IMAGE} is not available; falling back to ${CACHE_IMAGE}"
                  CACHE_IMAGE="golang:1.26-alpine3.23"
                fi
              fi

              docker build \
                --build-arg CACHE_IMAGE="${CACHE_IMAGE}" \
                --build-arg VERSION="${VERSION}" \
                --build-arg COMMIT="${COMMIT}" \
                --build-arg BUILD_DATE="${BUILD_DATE}" \
                --build-arg CPA_TOKEN="${CPA_TOKEN}" \
                -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest \
                .
        - name: docker push
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
        - name: sync to github
          imports: https://cnb.cool/liyao52033/envs/-/blob/main/github-env.yml
          script: |
            set -e
            TARGET_URL="https://github.com/liyao52033668/CLIProxyAPIPlus.git"

            echo "Configuring Git..."
            git config user.name "${GIT_USERNAME_NEW}"
            git config user.email "${GIT_EMAIL_NEW}"

            # Disable LFS locksverify — GitHub does not support the LFS locking API
            git config lfs.${TARGET_URL}/info/lfs.locksverify false

            echo "Adding GitHub remote..."
            git remote add github "https://${GIT_USERNAME_NEW}:${GIT_ACCESS_TOKEN_NEW}@github.com/liyao52033668/CLIProxyAPIPlus.git" || git remote set-url github "https://${GIT_USERNAME_NEW}:${GIT_ACCESS_TOKEN_NEW}@github.com/liyao52033668/CLIProxyAPIPlus.git"

            echo "Pushing main branch and tags..."
            git push github main --tags --force

            echo "✅ Sync to GitHub completed"
  
   
  pull_request:
    - stages:
        - name: code-review
          image: cnbcool/code-review:latest
          settings:
            # 输出文件路径
            output: ./code_review.json
            context: 10
            comment: true
            max_comments: 10
            max_diff_size: 100000
            # 是否在代码评审发现严重问题时返回非零退出码（流水线会失败）
            fail_on_critical: true
            # 指定 AI 模型
            # model: glm-4.7
            # AI 最大轮数限制（可选）
            # max_turns: 3
            # 将 prompt 输出到文件（调试用）
            # prompt_output: ./prompt.txt

"$":
  vscode:
    - docker:
        image: docker.cnb.cool/liyao52033/images/debian:latest
      runner:
        cpus: 16
      services:
        - vscode
        - docker
      stages:
        - name: 默认安装依赖
          script: |
            ls -al

